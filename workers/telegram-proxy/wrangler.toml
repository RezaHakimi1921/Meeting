name = "telegram-proxy"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# Create D1 in dashboard, then paste database_id here (optional for local wrangler)
[[d1_databases]]
binding = "DB"
database_name = "meeting-invites"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[triggers]
crons = ["* * * * *"]

[vars]
PUBLIC_BASE_URL = ""
ORIGIN_HINT = "http://94.182.92.79"
BOT_USERNAME = "Meetingir_mir_bot"

[observability]
enabled = false
