name = "telegram-proxy"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "meeting-invites"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[triggers]
crons = ["* * * * *"]

# SITE_URL = Cloudflare Pages project URL (clean host, no personal name, instant load).
# ORIGIN_HINT is only an emergency fallback when SITE_URL is unset.
[vars]
SITE_URL = "https://meet-story.pages.dev"
ORIGIN_HINT = "http://94.182.92.79"
BOT_USERNAME = "Meetingir_mir_bot"

[observability]
enabled = false
