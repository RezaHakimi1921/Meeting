# NOTE: On this server, port 80 is owned by Caddy (arte-caddy), not Nginx.
# Prefer deploy/Caddyfile.meeting.fragment.
# Kept as reference only if a dedicated Nginx host is used later.

server {
    listen 8088;
    server_name _;
    root /var/www;

    location = /meeting {
        return 301 /meeting/;
    }

    location /meeting/ {
        try_files $uri $uri/ /meeting/index.html;
    }
}
